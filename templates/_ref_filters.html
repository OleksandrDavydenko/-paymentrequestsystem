{# Фільтри за довідниками (організація, контрагент, вид витрат). Очікує refs = ref_filters(...).
   Вставляється всередину GET-форми. #}
<select name="org" onchange="this.form.submit()" aria-label="Організація" class="{{ 'is-active' if refs.org }}">
  <option value="">Усі організації</option>
  {% for key, label in ORGANIZATIONS.items() %}
  <option value="{{ key }}" {{ 'selected' if key == refs.org }}>{{ label }}</option>
  {% endfor %}
</select>
<select name="cp" onchange="this.form.submit()" aria-label="Контрагент" class="{{ 'is-active' if refs.cp }}">
  <option value="">Усі контрагенти</option>
  {% for key, label in COUNTERPARTIES.items() | sort(attribute='1') %}
  <option value="{{ key }}" {{ 'selected' if key == refs.cp }}>{{ label }}</option>
  {% endfor %}
</select>
<select name="exp" onchange="this.form.submit()" aria-label="Стаття витрат" class="{{ 'is-active' if refs.exp }}">
  <option value="">Усі статті витрат</option>
  {% for code in exp_options() %}
  <option value="{{ code }}" {{ 'selected' if code == refs.exp }}>{{ expense_name(code) }}</option>
  {% endfor %}
</select>
{% if request.args | reject('equalto', 'view') | list | length %}
<a class="btn btn-sm reset-filters" href="{{ url_for(request.endpoint, view=request.args.get('view')) }}">✕ Скинути фільтри</a>
{% endif %}
