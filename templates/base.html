<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заявки на оплату{% endblock %}</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f5f6f8; color: #1f2328; }
    header { background: #0f6cbd; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    dt { font-weight: 600; margin-top: 8px; }
    dd { margin: 0; color: #57606a; }
  </style>
</head>
<body>
  <header>
    <strong>Система заявок на оплату</strong>
    {% block header_right %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
