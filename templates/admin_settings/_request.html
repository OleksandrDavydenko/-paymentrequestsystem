<form method="post" action="{{ url_for('admin.admin_settings') }}" class="card process-settings" id="process-settings"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="tab" value="request">
  <div class="toolbar"><h2 style="margin:0">Заявка</h2></div>
  <div class="budget-section-title">Організація в заявці</div>
  {% for code, label in ORG_FIELD_MODES.items() %}
  <label class="mode-option">
    <input type="radio" name="org_field_mode" value="{{ code }}" {{ 'checked' if org_mode == code }}>
    <span>
      <strong>{{ label.split(':')[0] }}</strong>{% if org_mode == code %}<span class="mode-saved">діє зараз</span>{% endif %}
      <span class="muted">— {{ label.split(':', 1)[1].strip() }}</span>
      <span class="mode-hint">{% if code == 'organization' %}Від організації й форми оплати залежить, який бухгалтер перевіряє заявку.{% elif code == 'accountant' %}Ініціатор, який знає, до кого звертатися, одразу вибирає тип бухгалтера: по готівці, резидентів чи нерезидентів. Заявку бачать і опрацьовують усі люди з цією роллю (група в Azure), як і зараз. Організацію не вказують; призначення бухгалтерів організаціям не діє.{% else %}Простіше для ініціатора: «Українська компанія» чи «Іноземна компанія» достатньо, щоб визначити бухгалтера. Організацію в заявці не вказують; у списках замість неї — «Українська компанія» / «Іноземна компанія». Заявки, де організацію вже вибрано, показують її, як і раніше.{% endif %}</span>
    </span>
  </label>
  {% endfor %}
  <button type="submit" class="btn btn-primary btn-sm">Зберегти</button>
</form>
