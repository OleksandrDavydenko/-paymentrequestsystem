name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: PaymentRequestSystem   # назва ресурсу App Service

jobs:
  # Усі тести (у пам'яті, SQLite, SQL Server) і перевірка запуску gunicorn — див. tests.yml
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests   # якщо хоч один тест не пройшов — деплою не буде
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Залежності встановить сам App Service (SCM_DO_BUILD_DURING_DEPLOYMENT=true)
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
